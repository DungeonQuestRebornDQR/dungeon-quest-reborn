  *{margin:0;padding:0;box-sizing:border-box}
  nav { display: flex; align-items: center; justify-content: space-between; padding: 0 2rem; height: 58px; background: rgba(18,22,36,0.25); backdrop-filter: blur(8px); border-bottom: 1px solid rgba(255,255,255,0.07); position: fixed; top: 0; left: 0; right: 0; z-index: 999; width: 100%; font-family: 'Inter', sans-serif; }
  .nav-center { display: flex; gap: 0.25rem; }
  .nav-btn { background: none; border: none; color: #94a3b8; font-size: 0.875rem; font-family: 'Inter', sans-serif; padding: 0.4rem 0.85rem; border-radius: 6px; cursor: pointer; display: flex; align-items: center; gap: 0.3rem; transition: all 0.2s; }
  .nav-btn:hover { background: rgba(255,255,255,0.07); color: #fff; }
  .nav-right { display: flex; align-items: center; gap: 0.75rem; }
  .user-name { font-size: 0.875rem; color: #cbd5e1; }
  .bell-btn { background:none; border:none; color:#64748b; cursor:pointer; padding:0.3rem; border-radius:6px; }
  .bell-btn:hover { color:#fff; }
  body{
    background:#0d111c;
    padding: 24px;
    padding-top: 82px;
    font-family:'Inter', sans-serif;
  }
  .wrapper{
    background:transparent;
    border-radius:32px;
    padding:20px;
    overflow:hidden;
    position:relative;
    min-height: 90vh;
  }
  /* Filtros arriba a la derecha */
  .filters{
    position:absolute;
    top:20px;
    right:20px;
    display:flex;
    gap:12px;
    z-index:10;
  }
  .filter-btn{
    background:transparent;
    color:#e8ddd3;
    padding:14px 28px;
    border-radius:999px;
    font-size:15px;
    font-family:'Inter', sans-serif;
    border: none;
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
  }
  .filter-btn:hover{
    background: rgba(255,255,255,0.08);
  }
  .filter-btn.active{
    background: rgba(255,255,255,0.15);
    color: #ffffff;
    font-weight: 500;
  }

    <script>
      function toggleMenu() { const m=document.getElementById('hamburgerMenu'); m.style.display=m.style.display==='none'?'block':'none'; }
      document.addEventListener('click',function(e){ const btn=document.getElementById('hamburgerBtn'); if(btn&&!btn.contains(e.target)) document.getElementById('hamburgerMenu').style.display='none'; });
      function loginWithDiscord(){ const CLIENT_ID='1501765131749687316'; const REDIRECT_URI=encodeURIComponent('https://dungeonquestreborndqr.github.io/dungeon-quest-reborn/'); const SCOPE=encodeURIComponent('identify'); window.location.href=`https://discord.com/api/oauth2/authorize?client_id=${CLIENT_ID}&redirect_uri=${REDIRECT_URI}&response_type=token&scope=${SCOPE}`; }
      function resetBackgroundHome(e){
        e.preventDefault();
        localStorage.removeItem('booga_bg_url');
        localStorage.removeItem('booga_bg');
        localStorage.removeItem('ultra_minimal_bg_v1');
        location.reload();
      }
      function applyUserUI(user){ const avatarURL=user.avatar?`https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.png?size=128`:`https://cdn.discordapp.com/embed/avatars/0.png`; document.getElementById('userAvatar').src=avatarURL; document.getElementById('userName').textContent=user.username; document.getElementById('userSection').style.display='flex'; document.getElementById('loginBtn').style.display='none'; document.getElementById('menuLoginRow').style.display='none'; }
      const DQR_GUILD_ID='1493389918695723102';
      const DQR_ROLE_MAP=[
        {id:'1493458408496562296',name:'Developer',icon:'🛠️',color:'#a855f7'},
        {id:'1493395965795897445',name:'Creator',icon:'🎨',color:'#f59e0b'},
        {id:'1543457687210172466',name:'Senior Mod',icon:'🛡️',color:'#3b82f6'},
        {id:'1544693694349836409',name:'Mod',icon:'🛡️',color:'#38bdf8'},
        {id:'1544693922687750245',name:'Member',icon:'🎮',color:'#94a3b8'}
      ];
      function resolveDiscordRole(isOwner,roleIds){
        if(isOwner) return {name:'Owner',icon:'👑',color:'#22c55e'};
        for(const r of DQR_ROLE_MAP){ if(roleIds&&roleIds.includes(r.id)) return r; }
        return null;
      }
      function fetchDiscordRole(token){
        return Promise.all([
          fetch('https://discord.com/api/users/@me/guilds',{headers:{Authorization:'Bearer '+token}}).then(r=>r.ok?r.json():[]).catch(()=>[]),
          fetch('https://discord.com/api/users/@me/guilds/'+DQR_GUILD_ID+'/member',{headers:{Authorization:'Bearer '+token}}).then(r=>r.ok?r.json():null).catch(()=>null)
        ]).then(([guilds,member])=>{
          const g=Array.isArray(guilds)?guilds.find(x=>x.id===DQR_GUILD_ID):null;
          const isOwner=!!(g&&g.owner);
          const roleIds=member&&member.roles?member.roles:[];
          const role=resolveDiscordRole(isOwner,roleIds);
          if(role) sessionStorage.setItem('discordRoleInfo',JSON.stringify(role));
          else sessionStorage.removeItem('discordRoleInfo');
          return role;
        }).catch(()=>null);
      }
      (function(){
        (function(){ const saved=localStorage.getItem('booga_bg_url')||localStorage.getItem('booga_bg'); if(saved&&saved!=='original'){ const bgImg=document.querySelector('.video-bg img'); if(bgImg) bgImg.src=saved; } })();
        const saved=sessionStorage.getItem('discordUser'); if(saved){ applyUserUI(JSON.parse(saved)); const savedToken=sessionStorage.getItem('discordToken'); if(savedToken&&!sessionStorage.getItem('discordRoleInfo')){ fetchDiscordRole(savedToken); } }
        const hash=window.location.hash;
        if(hash.includes('access_token')){ const params=new URLSearchParams(hash.slice(1)); const token=params.get('access_token'); if(token){ sessionStorage.setItem('discordToken',token); fetch('https://discord.com/api/users/@me',{headers:{Authorization:'Bearer '+token}}).then(r=>r.json()).then(user=>{ sessionStorage.setItem('discordUser',JSON.stringify(user)); applyUserUI(user); fetchDiscordRole(token); history.replaceState(null,'',window.location.pathname); }); } }
      })();
    </script>
