<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lumora - Hero</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  nav { display: flex; align-items: center; justify-content: space-between; padding: 0 2rem; height: 58px; background: rgba(18,22,36,0.25); backdrop-filter: blur(8px); border-bottom: 1px solid rgba(255,255,255,0.07); position: fixed; top: 0; left: 0; right: 0; z-index: 999; width: 100%; font-family: 'Inter', sans-serif; }
  .nav-center { display: flex; gap: 0.25rem; }
  .nav-btn { background: none; border: none; color: #94a3b8; font-size: 0.875rem; font-family: 'Inter', sans-serif; padding: 0.4rem 0.85rem; border-radius: 6px; cursor: pointer; display: flex; align-items: center; gap: 0.3rem; transition: all 0.2s; }
  .nav-btn:hover { background: rgba(255,255,255,0.07); color: #fff; }
  .nav-right { display: flex; align-items: center; gap: 0.75rem; }
  .user-name { font-size: 0.875rem; color: #cbd5e1; }
  .bell-btn { background:none; border:none; color:#64748b; cursor:pointer; padding:0.3rem; border-radius:6px; }
  .bell-btn:hover { color:#fff; }
  body{
    background:#0d111c;
    padding: 24px;
    padding-top: 82px;
    font-family:'Inter', sans-serif;
  }
  .wrapper{
    background:transparent;
    border-radius:32px;
    padding:20px;
    overflow:hidden;
    position:relative;
    min-height: 90vh;
  }
  /* Filtros arriba a la derecha */
  .filters{
    position:absolute;
    top:20px;
    right:20px;
    display:flex;
    gap:12px;
    z-index:10;
  }
  .filter-btn{
    background:transparent;
    color:#e8ddd3;
    padding:14px 28px;
    border-radius:999px;
    font-size:15px;
    font-family:'Inter', sans-serif;
    border: none;
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
  }
  .filter-btn:hover{
    background: rgba(255,255,255,0.08);
  }
  .filter-btn.active{
    background: rgba(255,255,255,0.15);
    color: #ffffff;
    font-weight: 500;
  }
  .hero{
    margin-top:60px;
    background: #161c30;
    border-radius:24px;
    height: 78vh;
    position:relative;
    display:flex;
    align-items:flex-start;
    overflow:hidden;
  }
  .hero::before{
    content:'';
    position:absolute;
    inset:0;
    background: linear-gradient(90deg, rgba(0,0,0,0.35) 0%, rgba(0,0,0,0.05) 70%);
  }
  .hero-content{
    position:relative;
    z-index:2;
    padding:60px;
    max-width:750px;
    color:white;
  }
  .hero-content h1{
    font-family:'Syne', sans-serif;
    font-size: clamp(32px, 4.5vw, 58px);
    line-height:0.95;
    font-weight:700;
    letter-spacing:-1px;
    text-transform:uppercase;
    margin-bottom:20px;
  }
  .hero-content p{
    font-size:15px;
    line-height:1.5;
    opacity:0.9;
    max-width:320px;
    margin-bottom:32px;
  }
  .btn{
    background:white;
    color:black;
    padding:16px 28px;
    border-radius:12px;
    border:none;
    font-weight:500;
    cursor:pointer;
    font-size:15px;
  }
</style>
</head>
<body>
  <div style="position:fixed;top:58px;left:0;right:0;height:4px;background:linear-gradient(90deg,#7f1d1d,#ef4444,#7f1d1d);z-index:998;"></div>
  <nav>
  <div class="nav-center">
    <button class="nav-btn" onclick="window.location.href='index.html'">Home</button>
    <button class="nav-btn" onclick="window.location.href='index.html'">Wiki</button>
    <div class="nav-dropdown-wrap" style="position:relative;">
      <button class="nav-btn" id="tierListBtn" onclick="toggleTierListMenu(event)">
        TierList
        <svg id="tierListArrow" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="transition:transform 0.2s;"><polyline points="6 9 12 15 18 9"></polyline></svg>
      </button>
      <div id="tierListMenu" style="display:none;position:absolute;left:0;top:calc(100% + 8px);background:rgba(18,22,36,0.97);border:1px solid rgba(255,255,255,0.1);border-radius:10px;min-width:160px;overflow:hidden;backdrop-filter:blur(12px);z-index:200;">
        <a href="classes.html" style="display:block;padding:0.65rem 1.1rem;color:#cbd5e1;font-size:0.875rem;text-decoration:none;" onmouseover="this.style.background='rgba(255,255,255,0.07)'" onmouseout="this.style.background='transparent'">Classes</a>
        <a href="#" style="display:block;padding:0.65rem 1.1rem;color:#cbd5e1;font-size:0.875rem;text-decoration:none;" onmouseover="this.style.background='rgba(255,255,255,0.07)'" onmouseout="this.style.background='transparent'">Dungeons</a>
      </div>
    </div>
    <script>
      function toggleTierListMenu(e) {
        e.stopPropagation();
        const m = document.getElementById('tierListMenu');
        const arrow = document.getElementById('tierListArrow');
        const isOpen = m.style.display === 'block';
        m.style.display = isOpen ? 'none' : 'block';
        arrow.style.transform = isOpen ? 'rotate(0deg)' : 'rotate(180deg)';
      }
      document.addEventListener('click', function(e) {
        const btn = document.getElementById('tierListBtn');
        const menu = document.getElementById('tierListMenu');
        if (btn && menu && !btn.contains(e.target) && !menu.contains(e.target)) {
          menu.style.display = 'none';
          document.getElementById('tierListArrow').style.transform = 'rotate(0deg)';
        }
      });
    </script>
  </div>
  <div class="nav-right">
    <div id="userSection" style="display:none;align-items:center;gap:0.6rem;">
      <img id="userAvatar" src="" alt="" style="width:32px;height:32px;border-radius:50%;object-fit:cover;border:2px solid rgba(99,102,241,0.6);">
      <span id="userName" class="user-name"></span>
    </div>
    <button id="loginBtn" onclick="loginWithDiscord()" style="display:flex;align-items:center;gap:0.5rem;background:#5865F2;border:none;color:#fff;font-size:0.8rem;font-family:'Inter',sans-serif;font-weight:600;padding:0.4rem 0.85rem;border-radius:8px;cursor:pointer;transition:background 0.2s;" onmouseover="this.style.background='#4752c4'" onmouseout="this.style.background='#5865F2'">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="white"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg>
      Iniciar sesion
    </button>
    <div class="hamburger-wrap" style="position:relative;">
      <button class="bell-btn" id="hamburgerBtn" onclick="toggleMenu()" style="display:flex;flex-direction:column;gap:4px;padding:6px;">
        <span style="display:block;width:18px;height:2px;background:#94a3b8;border-radius:2px;"></span>
        <span style="display:block;width:18px;height:2px;background:#94a3b8;border-radius:2px;"></span>
        <span style="display:block;width:18px;height:2px;background:#94a3b8;border-radius:2px;"></span>
      </button>
      <div id="hamburgerMenu" style="display:none;position:absolute;right:0;top:calc(100% + 8px);background:rgba(18,22,36,0.97);border:1px solid rgba(255,255,255,0.1);border-radius:10px;min-width:160px;overflow:hidden;backdrop-filter:blur(12px);z-index:200;">
        <div id="menuLoginRow" style="padding:0.65rem 1.1rem;border-bottom:1px solid rgba(255,255,255,0.07);">
          <button onclick="loginWithDiscord()" style="width:100%;display:flex;align-items:center;gap:0.5rem;background:#5865F2;border:none;color:#fff;font-size:0.8rem;font-family:'Inter',sans-serif;font-weight:600;padding:0.4rem 0.7rem;border-radius:6px;cursor:pointer;">Iniciar sesion</button>
        </div>
        <a href="profile.html" style="display:block;padding:0.65rem 1.1rem;color:#cbd5e1;font-size:0.875rem;text-decoration:none;" onmouseover="this.style.background='rgba(255,255,255,0.07)'" onmouseout="this.style.background='transparent'">Profile</a>
        <a href="info.html" style="display:block;padding:0.65rem 1.1rem;color:#cbd5e1;font-size:0.875rem;text-decoration:none;" onmouseover="this.style.background='rgba(255,255,255,0.07)'" onmouseout="this.style.background='transparent'">Info</a>
        <a href="credits.html" style="display:block;padding:0.65rem 1.1rem;color:#cbd5e1;font-size:0.875rem;text-decoration:none;" onmouseover="this.style.background='rgba(255,255,255,0.07)'" onmouseout="this.style.background='transparent'">Credits</a>
        <a href="settings.html" style="display:block;padding:0.65rem 1.1rem;color:#cbd5e1;font-size:0.875rem;text-decoration:none;" onmouseover="this.style.background='rgba(255,255,255,0.07)'" onmouseout="this.style.background='transparent'">Settings</a>
        <a href="#" onclick="resetBackgroundHome(event)" style="display:block;padding:0.65rem 1.1rem;color:#cbd5e1;font-size:0.875rem;text-decoration:none;" onmouseover="this.style.background='rgba(255,255,255,0.07)'" onmouseout="this.style.background='transparent'">Restaurar fondo</a>
      </div>
    </div>
    <script>
      function toggleMenu() { const m=document.getElementById('hamburgerMenu'); m.style.display=m.style.display==='none'?'block':'none'; }
      document.addEventListener('click',function(e){ const btn=document.getElementById('hamburgerBtn'); if(btn&&!btn.contains(e.target)) document.getElementById('hamburgerMenu').style.display='none'; });
      function loginWithDiscord(){ const CLIENT_ID='1501765131749687316'; const REDIRECT_URI=encodeURIComponent('https://dungeonquestreborndqr.github.io/dungeon-quest-reborn/'); const SCOPE=encodeURIComponent('identify'); window.location.href=`https://discord.com/api/oauth2/authorize?client_id=${CLIENT_ID}&redirect_uri=${REDIRECT_URI}&response_type=token&scope=${SCOPE}`; }
      function resetBackgroundHome(e){
        e.preventDefault();
        localStorage.removeItem('booga_bg_url');
        localStorage.removeItem('booga_bg');
        localStorage.removeItem('ultra_minimal_bg_v1');
        location.reload();
      }
      function applyUserUI(user){ const avatarURL=user.avatar?`https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.png?size=128`:`https://cdn.discordapp.com/embed/avatars/0.png`; document.getElementById('userAvatar').src=avatarURL; document.getElementById('userName').textContent=user.username; document.getElementById('userSection').style.display='flex'; document.getElementById('loginBtn').style.display='none'; document.getElementById('menuLoginRow').style.display='none'; }
      const DQR_GUILD_ID='1493389918695723102';
      const DQR_ROLE_MAP=[
        {id:'1493458408496562296',name:'Developer',icon:'🛠️',color:'#a855f7'},
        {id:'1493395965795897445',name:'Creator',icon:'🎨',color:'#f59e0b'},
        {id:'1543457687210172466',name:'Senior Mod',icon:'🛡️',color:'#3b82f6'},
        {id:'1544693694349836409',name:'Mod',icon:'🛡️',color:'#38bdf8'},
        {id:'1544693922687750245',name:'Member',icon:'🎮',color:'#94a3b8'}
      ];
      function resolveDiscordRole(isOwner,roleIds){
        if(isOwner) return {name:'Owner',icon:'👑',color:'#22c55e'};
        for(const r of DQR_ROLE_MAP){ if(roleIds&&roleIds.includes(r.id)) return r; }
        return null;
      }
      function fetchDiscordRole(token){
        return Promise.all([
          fetch('https://discord.com/api/users/@me/guilds',{headers:{Authorization:'Bearer '+token}}).then(r=>r.ok?r.json():[]).catch(()=>[]),
          fetch('https://discord.com/api/users/@me/guilds/'+DQR_GUILD_ID+'/member',{headers:{Authorization:'Bearer '+token}}).then(r=>r.ok?r.json():null).catch(()=>null)
        ]).then(([guilds,member])=>{
          const g=Array.isArray(guilds)?guilds.find(x=>x.id===DQR_GUILD_ID):null;
          const isOwner=!!(g&&g.owner);
          const roleIds=member&&member.roles?member.roles:[];
          const role=resolveDiscordRole(isOwner,roleIds);
          if(role) sessionStorage.setItem('discordRoleInfo',JSON.stringify(role));
          else sessionStorage.removeItem('discordRoleInfo');
          return role;
        }).catch(()=>null);
      }
      (function(){
        (function(){ const saved=localStorage.getItem('booga_bg_url')||localStorage.getItem('booga_bg'); if(saved&&saved!=='original'){ const bgImg=document.querySelector('.video-bg img'); if(bgImg) bgImg.src=saved; } })();
        const saved=sessionStorage.getItem('discordUser'); if(saved){ applyUserUI(JSON.parse(saved)); const savedToken=sessionStorage.getItem('discordToken'); if(savedToken&&!sessionStorage.getItem('discordRoleInfo')){ fetchDiscordRole(savedToken); } }
        const hash=window.location.hash;
        if(hash.includes('access_token')){ const params=new URLSearchParams(hash.slice(1)); const token=params.get('access_token'); if(token){ sessionStorage.setItem('discordToken',token); fetch('https://discord.com/api/users/@me',{headers:{Authorization:'Bearer '+token}}).then(r=>r.json()).then(user=>{ sessionStorage.setItem('discordUser',JSON.stringify(user)); applyUserUI(user); fetchDiscordRole(token); history.replaceState(null,'',window.location.pathname); }); } }
      })();
    </script>
  </div>
</nav>
  <div class="wrapper">
    <div class="filters">
      <button class="filter-btn" onclick="selectFilter(this)">Creator Idk</button>
      <button class="filter-btn" onclick="selectFilter(this)">Dev Jgpc</button>
      <button class="filter-btn" onclick="selectFilter(this)">Ryzsar</button>
    </div>

    <div class="hero">
      <div class="hero-content">
        <h1>Credits</h1>
      </div>
    </div>
  </div>
  <script>
    function selectFilter(btn) {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }
  </script>
</body>
</html>
